name: Basic Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  basic-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Check for common issues
        run: |
          echo "## Code Review Checks" > review.md
          echo "" >> review.md
          
          if grep -rn "System.out.println" src/main/java/ 2>/dev/null; then
          echo "🟡 **Warning**: Found System.out.println, use a logger instead" >> review.md
          fi
          
          if grep -rEn "(password|secret|apikey)\s*=\s*\"[^\"]+\"" src/ 2>/dev/null; then
          echo "🔴 **Critical**: Possible hardcoded credentials" >> review.md
          fi
          
          TODO_COUNT=$(grep -r "TODO" src/ 2>/dev/null | wc -l)
          if [ "$TODO_COUNT" -gt 0 ]; then
          echo "🔵 **Info**: Found $TODO_COUNT TODO comments" >> review.md
          fi
          
          cat review.md

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');

            const marker = '<!-- basic-code-review -->';
            const body = marker + '\n' + review;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }