name: Deploy
on:
  push:
    branches:
      - master
      - 'release/*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-tag: ${{ steps.version.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: mvn clean verify

      - name: Get version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image-tag=$VERSION-$SHORT_SHA" >> $GITHUB_OUTPUT

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/master' || github.event.inputs.environment == 'staging'
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to STAGING"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Image tag: ${{ needs.build.outputs.image-tag }}"

      - name: Run smoke tests
        run: echo "Smoke tests passed"

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/heads/release/') || github.event.inputs.environment == 'production'
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to PRODUCTION"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Image tag: ${{ needs.build.outputs.image-tag }}"


