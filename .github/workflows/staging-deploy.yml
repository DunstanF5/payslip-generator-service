name: Deploy to Staging

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dunstanf5/payslip-generator-service


jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      java-version: '17'
      run-tests: true
      upload-artifact: true

  docker-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "image-tag=master-$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image-tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-publish
    runs-on: ubuntu-latest
    environment: 'staging'

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
          --name ${{ vars.CONTAINER_APP_NAME }} \
          --resource-group payslip-tutorial-rg \
          --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker-publish.outputs.image-tag }}

      - name: Smoke test staging
        run: |
          for i in {1..10}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.APP_URL }}/actuator/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Staging healthy"
                exit 0
              fi
              echo "Attempt $i: HTTP $STATUS, retrying in 15s..."
              sleep 15
            done
            echo "Staging did not become healthy"
            exit 1

    
